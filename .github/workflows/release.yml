name: Release

# Publishes the GitHub release of a tag `vX.Y.Z` after the commit-subject check
# and the CI suite (a library: release notes only, no bundles). Called by
# release-on-main.yml once it has tagged the merge of a release pull request;
# also runs on a tag pushed by hand and by hand (`workflow_dispatch` on the
# tag's ref: publishes `tag` only when `upload` is set). A tag pushed by
# release-on-main.yml (GITHUB_TOKEN) starts no second run.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: "Release tag"
        type: string
        required: true
      upload:
        description: "Publish the release"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
      upload:
        description: "Publish the release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  commits:
    uses: ./.github/workflows/commits.yml

  ci:
    uses: ./.github/workflows/ci.yml

  release:
    # The notes are the tag's changelog section, generated from the commits
    # since the previous tag (.github/release/notes.sh, cliff.toml).
    needs: [commits, ci]
    if: inputs.upload || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        run: .github/release/notes.sh "$TAG" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.repository.name }} ${{ env.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file notes.md
          fi
