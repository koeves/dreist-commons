name: Release on main

# Merging the release pull request (dev -> main) releases: the version comes
# from the commits since the last tag (.github/release/next-version.sh; a
# `Release-As: X.Y.Z` line in the pull request's body or a commit message
# overrides it), the merge commit is tagged `vX.Y.Z` and release.yml
# publishes it with the changelog section as its notes. Nothing is released
# when no commit since the tag is releasable. Afterwards dev is
# fast-forwarded to main (.github/release/sync-dev.sh).
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag
      pull-requests: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: The merged pull request's body
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' > "$RUNNER_TEMP/pr-body.txt"
      - name: Next version
        id: next
        env:
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.txt
        run: .github/release/next-version.sh
      - name: Tag the merge commit
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$REPO $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      upload: true
    permissions:
      contents: write
      pull-requests: write # release.yml -> commits.yml (release-version)

  dev:
    # dev follows main with the DEV_SYNC_KEY deploy key (the dev ruleset's
    # bypass): a fast-forward, or main merged into dev when dev has moved on;
    # a sync pull request only when that merge conflicts. Skipped while the
    # secret is not set.
    needs: [version, release]
    if: always() && needs.version.result == 'success' && needs.release.result != 'failure' && needs.release.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the sync branch
      pull-requests: write
      actions: write # dispatch the checks
    env:
      DEV_SYNC_KEY: ${{ secrets.DEV_SYNC_KEY }}
    steps:
      - name: No deploy key
        if: env.DEV_SYNC_KEY == ''
        run: echo "::notice::DEV_SYNC_KEY is not set, so dev was not fast-forwarded to main."
      - uses: actions/checkout@v7
        if: env.DEV_SYNC_KEY != ''
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEV_SYNC_KEY }}
          persist-credentials: true
      - name: Fast-forward dev
        if: env.DEV_SYNC_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release/sync-dev.sh
