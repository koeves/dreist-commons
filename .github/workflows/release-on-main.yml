name: Release on main

# Merging the release pull request (dev -> main) releases the version that
# .github/release/prepare.sh wrote into Cargo.toml and CHANGELOG.md on dev
# (.github/release/release-version.sh checks them): the merge commit is
# tagged `vX.Y.Z` and release.yml publishes it. Nothing is released when no
# release was prepared.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-on-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the tag
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version
        id: next
        run: .github/release/release-version.sh --release
      - name: Tag the merge commit
        if: steps.next.outputs.tag != ''
        env:
          TAG: ${{ steps.next.outputs.tag }}
          REPO: ${{ github.event.repository.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$REPO $TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      upload: true
    permissions:
      contents: write

