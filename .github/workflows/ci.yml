name: CI

# Runs on pull requests into dev and main, inside the release (release.yml)
# and by hand; never on plain branch pushes.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Windows that tests open stay in the background (vendor/baseview).
  DREIST_BACKGROUND_GUI: "1"

# Tests that need an app's UI or factory assets skip without them; Dreist's
# CI runs this suite against its assets.
# Pull requests into dev run the fast checks (Linux); macOS (Apple Silicon and
# Intel) and Windows run on the release pull request (into main) and in the
# release. A skipped job counts as passed for the branch rules.
jobs:
  changes:
    # Whether a pull request changes more than Markdown: a docs-only pull
    # request skips the build and test jobs. Anything but a pull request runs
    # them all.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && files=$(git diff --name-only "$BASE" "$HEAD") && [ -n "$files" ] \
            && ! printf '%s\n' "$files" | grep -qvE '\.md$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Engine, DSP, editor and GUI tests run headless on Linux; the X11
    # window code and the host crate (ALSA audio and MIDI, portal file
    # dialogs) build and lint here too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          # The runners' default Azure mirror sometimes stops resolving; use the main archive.
          sudo sed -i -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          grep -h '^URIs' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (window)
        run: cargo clippy --locked --workspace --all-targets --features dreist-gui/window -- -D warnings
      - name: Clippy (host)
        run: cargo clippy --locked -p dreist-host --all-targets --all-features -- -D warnings
      - name: Test (window)
        run: cargo test --locked -p dreist-gui --features window
      - name: Test (host)
        run: cargo test --locked -p dreist-host --all-features
      - name: Test
        # The effect fingerprints hash float output, which differs between
        # platforms: they are checked on macOS below, here non-fatal.
        run: cargo test --locked --workspace -- --skip effects_match_fingerprints
      - name: Effect fingerprints (platform-dependent)
        continue-on-error: true
        run: cargo test --locked -p dreist-dsp --test fx_harness effects_match_fingerprints

  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    # The full suite, effect fingerprints included, and the AppKit window code.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (window)
        run: cargo clippy --locked --workspace --all-targets --features dreist-gui/window -- -D warnings
      - name: Clippy (host)
        run: cargo clippy --locked -p dreist-host --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Test (window)
        run: cargo test --locked -p dreist-gui --features window
      - name: Test (host)
        run: cargo test --locked -p dreist-host --all-features

  macos-intel:
    needs: changes
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.base_ref == 'main')
    # The full suite on Intel (x86_64): the apps ship universal macOS binaries.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        # The effect fingerprints hash float output, which differs on x86_64:
        # they are checked on Apple Silicon above, here non-fatal.
        run: cargo test --locked --workspace -- --skip effects_match_fingerprints
      - name: Effect fingerprints (platform-dependent)
        continue-on-error: true
        run: cargo test --locked -p dreist-dsp --test fx_harness effects_match_fingerprints
      - name: Test (window)
        run: cargo test --locked -p dreist-gui --features window
      - name: Test (host)
        run: cargo test --locked -p dreist-host --all-features

  packaging:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # The apps' install scripts (packaging/), with a fake app on every system,
    # and the Audio Unit build on macOS.
    # Linux only on pull requests into dev.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name != 'pull_request' || github.base_ref == 'main') && fromJSON('["ubuntu-24.04", "macos-15", "windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        if: runner.os != 'Windows'
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          shellcheck packaging/install.sh packaging/test-install.sh
      - name: Test (install.sh)
        if: runner.os != 'Windows'
        run: sh packaging/test-install.sh
      - name: Audio Unit (auval)
        # A test CLAP with the apps' buses, wrapped as a universal AUv2,
        # installed and checked with auval (packaging/auv2/test.sh).
        if: runner.os == 'macOS'
        run: |
          shellcheck packaging/auv2/build.sh packaging/auv2/test.sh
          packaging/auv2/test.sh
      - name: Test (install.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test-install.ps1
