name: CI

# Runs on pull requests into dev and main, inside the release (release.yml)
# and by hand (release-on-main.yml dispatches it on the follow-up changelog
# pull request's branch); never on plain branch pushes.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Windows that tests open stay in the background (vendor/baseview).
  DREIST_BACKGROUND_GUI: "1"

# Tests that need an app's UI or factory assets skip without them; Dreist's
# CI runs this suite against its assets.
jobs:
  linux:
    # Engine, DSP, editor and GUI tests run headless on Linux; the X11
    # window code and the host crate (ALSA audio and MIDI, portal file
    # dialogs) build and lint here too.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libasound2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxcursor-dev libgl1-mesa-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (window)
        run: cargo clippy --locked --workspace --all-targets --features dreist-gui/window -- -D warnings
      - name: Clippy (host)
        run: cargo clippy --locked -p dreist-host --all-targets --all-features -- -D warnings
      - name: Test (window)
        run: cargo test --locked -p dreist-gui --features window
      - name: Test (host)
        run: cargo test --locked -p dreist-host --all-features
      - name: Test
        # The effect fingerprints hash float output, which differs between
        # platforms: they are checked on macOS below, here non-fatal.
        run: cargo test --locked --workspace -- --skip effects_match_fingerprints
      - name: Effect fingerprints (platform-dependent)
        continue-on-error: true
        run: cargo test --locked -p dreist-dsp --test fx_harness effects_match_fingerprints

  macos:
    # The full suite, effect fingerprints included, and the AppKit window code.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Clippy (window)
        run: cargo clippy --locked --workspace --all-targets --features dreist-gui/window -- -D warnings
      - name: Clippy (host)
        run: cargo clippy --locked -p dreist-host --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace
      - name: Test (window)
        run: cargo test --locked -p dreist-gui --features window
      - name: Test (host)
        run: cargo test --locked -p dreist-host --all-features
