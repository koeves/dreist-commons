name: Commits

# Commit subjects follow Conventional Commits (see CONTRIBUTING.md): the
# pull request title on pull requests into dev (squash merges make it the commit),
# the commits since the last release tag everywhere else; version, changelog
# and release notes are generated from them; the release pull request (into
# main) shows the version it releases (release-version). Runs on pull
# requests, inside the release (release.yml) and by hand.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run.
concurrency:
  group: commits-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conventional:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the pull request title (squashed into dev)
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          if ! printf '%s' "$TITLE" | grep -Eq "$re"; then
            echo "::error::The pull request title \"$TITLE\" is not a Conventional Commit subject (it becomes the squash commit)"
            exit 1
          fi
      - name: Check commit subjects
        if: "!(github.event_name == 'pull_request' && github.base_ref == 'dev')"
        run: |
          # The commits since the previous release tag (all of them before the first).
          if prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null); then
            range="$prev..HEAD"
          else
            range="HEAD"
          fi
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*'
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}; subject=${line#* }
            if ! printf '%s' "$subject" | grep -Eq "$re"; then
              echo "::error::$sha: \"$subject\" is not a Conventional Commit subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$range")
          exit $bad

  release-version:
    # On the release pull request (into main): the version its merge releases
    # (.github/release/next-version.sh; `Release-As: X.Y.Z` in the body or a
    # commit overrides it), in the job summary. Fails only when that version
    # is not usable (already tagged, not X.Y.Z).
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: The version this release pull request releases
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.txt"
          PR_BODY_FILE="$RUNNER_TEMP/pr-body.txt" GITHUB_OUTPUT=/dev/null .github/release/next-version.sh
