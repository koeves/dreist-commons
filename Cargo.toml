[workspace]
resolver = "2"
members = ["crates/dreist-formats", "crates/dreist-dsp", "crates/dreist-engine", "crates/dreist-gui", "crates/dreist-testkit", "crates/dreist-host"]

[workspace.package]
edition = "2024"
version = "0.2.3"
license = "MIT OR Apache-2.0"

# The DSP follows the original closely: constants as the original
# has them, operations in its order, explicit min/max where
# `clamp` would treat NaN differently.
[workspace.lints.clippy]
approx_constant = "allow"
excessive_precision = "allow"
assign_op_pattern = "allow"
manual_clamp = "allow"
needless_range_loop = "allow"
collapsible_if = "allow"
collapsible_else_if = "allow"
too_many_arguments = "allow"
neg_cmp_op_on_partial_ord = "allow"
type_complexity = "allow"
manual_range_contains = "allow"

# Third-party versions for the commons crates; the apps declare none of
# their own and take these through the commons crates (dreist-host
# re-exports what they use directly).
[workspace.dependencies]
roxmltree = "0.21"
thiserror = "2"
libc = "0.2"
# cpal and midir as nih-plug's standalone (vendor/nih-plug) resolves them,
# so the app links one copy of each.
cpal = "=0.15.3"
midir = "=0.11.1"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The revision vendor/nih-plug builds on.
clap-sys = { git = "https://github.com/micahrj/clap-sys.git", rev = "25d7f53fdb6363ad63fbd80049cb7a42a97ac156" }

[profile.release]
strip = false

# The validation harness renders minutes of audio: optimise tests, keep
# debug assertions and overflow checks.
[profile.test]
opt-level = 2

# baseview with a re-entrancy guard (vendor/baseview/src/macos/window.rs):
# modal dialogs opened from a mouse event aborted the app.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { path = "vendor/baseview" }

# signalsmith-stretch with a fixed phase-randomisation seed
# (vendor/signalsmith-stretch/src/wrapper.cpp) for reproducible renders.
# softbuffer whose macOS observer class has a name unique to each copy of
# the library (vendor/softbuffer/src/backends/cg.rs): two plugins in one
# host aborted it when the second opened its editor.
[patch.crates-io]
signalsmith-stretch = { path = "vendor/signalsmith-stretch" }
softbuffer = { path = "vendor/softbuffer" }
