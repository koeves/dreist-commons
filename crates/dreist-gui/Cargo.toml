[package]
name = "dreist-gui"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "VCtrl-compatible GUI toolkit drawing the skins (tiny-skia)"

[dependencies]
dreist-formats = { path = "../dreist-formats" }
tiny-skia = "0.12"
fontdue = "0.9"
baseview = { git = "https://github.com/RustAudio/baseview.git", rev = "579130ecb4f9f315ae52190af42f0ea46aeaa4a2", optional = true, features = ["opengl"] }
softbuffer = { version = "0.4", optional = true, default-features = false }
raw-window-handle = { version = "0.6", optional = true }
raw-window-handle-05 = { package = "raw-window-handle", version = "0.5", optional = true }
keyboard-types = { version = "0.6.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", optional = true }

# softbuffer's X11 backend (libxcb / libX11 loaded at run time).
[target.'cfg(target_os = "linux")'.dependencies]
softbuffer = { version = "0.4", optional = true, default-features = false, features = ["x11", "x11-dlopen"] }

[features]
window = ["dep:baseview", "dep:softbuffer", "dep:raw-window-handle", "dep:raw-window-handle-05", "dep:keyboard-types", "dep:objc"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc = "0.2"
raw-window-handle-05 = { package = "raw-window-handle", version = "0.5" }

[[example]]
name = "skinview"
required-features = ["window"]

[[test]]
name = "parented_classes"
harness = false
required-features = ["window"]

[lints]
workspace = true
